name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# The pnpm action gets no 'version' input - it reads the packageManager field of
# package.json, which is what keeps CI and local machines on the same version.

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile

      # This repo is a Chrome extension boilerplate and exposes no lint or
      # standalone typecheck script - the build (vite + tsc per bundle) is the
      # only gate there is. If either script is added, it goes here.
      - name: Build
        run: pnpm run build
